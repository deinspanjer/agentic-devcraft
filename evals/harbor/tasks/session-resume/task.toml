schema_version = "1.4"
multi_step_reward_strategy = "mean"

[task]
name = "agentic-devcraft/session-resume-spike"
version = "1.0.0"
description = "Prove that Harbor resumes a coding agent's native session."
authors = []
keywords = ["spike", "conversation", "resume"]

[[steps]]
name = "remember"
min_reward = 1.0

[[steps]]
name = "recall"
min_reward = 1.0

[agent]
timeout_sec = 300.0
user = "node"

[verifier]
timeout_sec = 30.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
mcp_servers = []

[environment.env]

[verifier.env]

[solution.env]
